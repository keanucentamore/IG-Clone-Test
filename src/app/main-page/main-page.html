<main>
  @for (post of posts; track post.name; let i = $index) {
    <section class="post">
      <h2 class="post__name">{{ i }}: {{ post.name }}</h2>
      <img class="post__image" [src]="post.image" [alt]="'Post von ' + post.name">
      <div class="post__likes">
        <img src="./img/heart-black.png" alt="">
        <span>{{ post.likes }}</span>
      </div>
    </section>
  }
</main>
